services:
  redis:
    image: redis:7-alpine
    container_name: ai-converter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Lightweight healthcheck so the app only starts once Redis is ready
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-converter:
    # image is pushed by CI (GHCR); server only needs `docker compose pull`
    image: ghcr.io/syahrulrzk/ai-convextract:latest
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379

volumes:
  redis-data:
