services:
  redis:
    image: redis:7-alpine
    container_name: ai-converter-redis
    ports:
      # Host port is OPTIONAL; the app talks to Redis via the Docker network.
      # If 6379 is already in use, set REDIS_HOST_PORT=6380 (or another free port).
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    # Lightweight healthcheck so the app only starts once Redis is ready
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-converter:
    # image is pushed by CI (GHCR); server only needs `docker compose pull`
    image: ghcr.io/syahrulrzk/ai-convextract:latest
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
      - APP_VERSION=${APP_VERSION:-V.0.1}
      - API_KEY=${API_KEY:?API_KEY wajib diisi}
      - EXTRACT_JOB_TIMEOUT_MS=${EXTRACT_JOB_TIMEOUT_MS:-3600000}
      - EXTRACT_COLLECT_TIMEOUT_MS=${EXTRACT_COLLECT_TIMEOUT_MS:-120000}
      - EXTRACT_COLLECT_MAX_TIMEOUT_MS=${EXTRACT_COLLECT_MAX_TIMEOUT_MS:-3000000}

volumes:
  redis-data:
